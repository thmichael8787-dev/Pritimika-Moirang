<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forever Pritimika ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: Georgia, serif;
  color: white;
  background:
    linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65)),
    url("825323213_17899536879656125_5706079407998776898_n.webp");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

.container {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 25px;
}

h1 {
  font-size: 42px;
  margin-bottom: 20px;
  text-shadow: 0 2px 15px black;
}

p {
  font-size: 19px;
  line-height: 1.8;
  max-width: 500px;
  text-shadow: 0 2px 10px black;
}

.heart {
  font-size: 55px;
  margin: 25px;
  animation: beat 1s infinite;
}

@keyframes beat {
  50% { transform: scale(1.25); }
}

button {
  margin-top: 25px;
  padding: 14px 30px;
  border: 1px solid white;
  border-radius: 30px;
  background: rgba(255,255,255,0.2);
  color: white;
  font-size: 17px;
  cursor: pointer;
}

button:hover {
  background: white;
  color: black;
}
</style>
</head>

<body>

<div class="container">
  <h1>Forever, Pritimika ❤️</h1>

  <div class="heart">♥</div>

  <p>
    Some people make life beautiful just by being in it.
    You are one of those people.
    <br><br>
    No matter where life takes us,
    you will always have a special place in my heart.
    <br><br>
    You are my favourite person. ❤️
  </p>

  <button onclick="alert('You are loved more than words can say ❤️')">
    Open My Heart 💌
  </button>
</div>

</body>
</html>
